# Tooling config only (lint + tests). PAIEP is not packaged/published.
[tool.ruff]
# Containers run 3.11, but host helpers (e.g. benchmarks/m1/bench.py) may run on
# Ubuntu 22.04's python3 (3.10) — keep code 3.10-compatible.
target-version = "py310"
line-length = 110
extend-exclude = ["experiments"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Scripts put the repo root on sys.path before importing the package.
"scripts/*.py" = ["E402"]
"benchmarks/**/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
