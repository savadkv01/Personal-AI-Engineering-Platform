name: PAIEP local models
version: 0.7.0
schema: v1
# Generated by templates/workspace (M7). Chat/edit go through the PAIEP gateway (bearer
# token, concurrency cap); autocomplete uses a small draft model on Ollama directly
# (Phase 09 §1.1) because tab completion needs the lowest latency.
# Secret: PAIEP_GATEWAY_TOKEN in .continue/.env (git-ignored) — never in this file.
models:
  - name: PAIEP {{ cookiecutter.chat_model }} (local)
    provider: openai
    model: {{ cookiecutter.chat_model }}
    apiBase: {{ cookiecutter.gateway_url }}
    # Bearer header, not apiKey: Continue substitutes secrets into YAML text and re-parses it,
    # so an all-digit token becomes a YAML number and the key is rejected.
    requestOptions:
      # Milliseconds for the OpenAI client (default 10 min aborts slow CPU agent prompts) and
      # x1000 for Continue's socket timer, so keep it < 2147483. Matches the gateway's 1800 s.
      timeout: 1800000
      headers:
        authorization: Bearer ${{ '{{' }} secrets.PAIEP_GATEWAY_TOKEN {{ '}}' }}
    roles: [chat, edit, apply]
    capabilities: [tool_use]
    defaultCompletionOptions:
      temperature: 0.2
      maxTokens: 1024
      contextLength: 8192
{%- if cookiecutter.inline_provider == "continue" %}
  - name: PAIEP autocomplete {{ cookiecutter.autocomplete_model }}
    provider: ollama
    model: {{ cookiecutter.autocomplete_model }}
    apiBase: {{ cookiecutter.ollama_url }}
    roles: [autocomplete]
    autocompleteOptions:
      debounceDelay: 350
      maxPromptTokens: 1024
      onlyMyCode: true
{%- endif %}
