{%- set cli = cookiecutter.compose_cli.split(' ') -%}
name: PAIEP MCP servers
version: 0.7.0
schema: v1
# Generated by templates/workspace (M7). Two containers: fs+git run with NO network;
# rag+memory+paiep-tools reach the shared backend on the internal Docker network.
# Policy is enforced server-side (PAIEP config/mcp.yaml). Continue uses MCP in agent mode.
mcpServers:
  - name: paiep-local
    type: stdio
    command: {{ cli[0] }}
    args: [{% for a in cli[1:] %}"{{ a }}", {% endfor %}"-f", "__PAIEP_HOME__/docker/docker-compose.yml", "--profile", "mcp",
           "run", "--rm", "-T", "mcp-local", "fs", "git"]
    env:
      PAIEP_WORKSPACE: "__PAIEP_WORKSPACE__"
      PAIEP_SCOPE: "{{ cookiecutter.memory_scope }}"
  - name: paiep
    type: stdio
    command: {{ cli[0] }}
    args: [{% for a in cli[1:] %}"{{ a }}", {% endfor %}"-f", "__PAIEP_HOME__/docker/docker-compose.yml", "--profile", "mcp",
           "run", "--rm", "-T", "mcp", "rag", "memory", "paiep-tools"]
    env:
      PAIEP_WORKSPACE: "__PAIEP_WORKSPACE__"
      PAIEP_SCOPE: "{{ cookiecutter.memory_scope }}"
