# PAIEP CI — fast, offline-style checks (no models, no running services).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11" # matches the ingest/rag image
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            rag/ingest/requirements.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest

  docs:
    name: markdown links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-links.py

  compose:
    name: compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f docker/docker-compose.yml --profile "*" config -q
